name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Lint, build, and test
    runs-on: xcode-27
    # Successful runs take 18 to 23 minutes. Under load, the iOS package's cold
    # build-for-testing alone can take up to BUILD_TIMEOUT (2400 s) in scripts/test-kit-ios.py,
    # so the job allows for that plus the other steps. The script's per-phase limits still
    # bound a hung build or test run.
    timeout-minutes: 75
    env:
      # The image defaults to Xcode 27.1; the project needs 27.2.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      # This job needs no mise tools (ShellCheck and actionlint run in repo-lint),
      # so don't let `mise run` install them either.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install: false

      - name: Cache xcprojformatter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/tools
          key: xcprojformatter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/xcprojformatter.sh') }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Lint Swift
        run: mise run lint:swift

      - name: Check project.xcproj is canonical
        run: mise run xcproj:check

      # strings:check rejects hard-coded-strings baseline entries the base doesn't have: the target
      # branch for a pull request, the commit before the push on main (on main itself, origin/main
      # is the pushed commit). The shallow checkout has neither. If the fetch fails (a new branch,
      # a force push), strings:check warns and skips that comparison.
      - name: Fetch the strings baseline's base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          else
            git fetch --no-tags --depth=1 origin "$BEFORE" || echo "::warning::Couldn't fetch $BEFORE"
          fi

      - name: Check Localizable.xcstrings is up to date
        env:
          STRINGS_BASELINE_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: mise run strings:check

      - name: Test repository tools
        run: mise run test:tools

      - name: Test AudiobookshelfKit
        run: mise run test:kit

      - name: Test iOS-only ShakeDetector package suite
        run: mise run test:kit:ios

      # In CI test:kit:ios creates its own abs-ci-<run>-<attempt>-* simulator, because the runner's
      # instances share one CoreSimulator device set, and deletes it. If the job was killed first,
      # delete it here. GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT come from the runner's environment.
      - name: Delete this run's iOS test simulators
        if: always()
        run: scripts/test-kit-ios.sh --delete-run-simulators

      - name: Slow AudiobookshelfKit tests
        if: github.event_name == 'push'
        run: mise run test:kit:slow

      - name: Build for iOS Simulator
        run: mise run build:ios

      - name: Test app on macOS
        run: mise run test:app

  ui-tests:
    name: UI tests
    runs-on: xcode-27
    # A job of its own, so its cold app builds run beside build-and-test rather than after it.
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install: false

      - name: Show Xcode version
        run: xcodebuild -version

      # The runner's instances share one CoreSimulator device set, so the job makes its own iPhone
      # Duo (simctl picks the newest runtime for it) and deletes it below. Not abs-ci-<run>-*:
      # build-and-test deletes those, possibly while this job still uses its simulator.
      - name: Create an iPhone Duo simulator
        run: |
          udid="$(xcrun simctl create "abs-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo)"
          echo "IOS_SIMULATOR_ID=$udid" >> "$GITHUB_ENV"

      - name: UI tests on the iPhone Duo simulator
        env:
          ABS_UI_PLATFORM: ios
        run: mise run test:ui

      # XCUITest on macOS needs Automation Mode, which only an administrator on the runner can
      # enable (docs/testing/ui-tests.md). Until then, warn rather than pass silently.
      - name: UI tests on macOS
        if: ${{ !cancelled() }}
        run: |
          status="$(automationmodetool)"
          echo "$status"
          if grep -q "Automation Mode is disabled" <<< "$status"; then
            echo "::warning title=macOS UI tests skipped::Automation Mode is disabled on this runner, so the macOS UI tests didn't run. An administrator must run 'sudo automationmodetool enable-automationmode-without-authentication' on it."
            exit 0
          fi
          mise run test:ui

      - name: Delete the iPhone Duo simulator
        if: always() && env.IOS_SIMULATOR_ID != ''
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR_ID" || true
          xcrun simctl delete "$IOS_SIMULATOR_ID"
