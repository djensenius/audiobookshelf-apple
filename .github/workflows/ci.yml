name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Lint, build, and test
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The image defaults to Xcode 27.1; the project needs 27.2.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Lint Swift
        run: mise run lint:swift

      - name: Check project.xcproj is canonical
        run: mise run xcproj:check

      - name: Test AudiobookshelfKit
        run: mise run test:kit

      - name: Build for iOS Simulator
        run: mise run build:ios

      - name: Test app on macOS
        run: mise run test:app
