name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Lint, build, and test
    runs-on: xcode-27
    # Successful runs take 18 to 23 minutes. Under load, the iOS package's cold
    # build-for-testing alone can take up to BUILD_TIMEOUT (2400 s) in scripts/test-kit-ios.py,
    # so the job allows for that plus the other steps. The script's per-phase limits still
    # bound a hung build or test run.
    timeout-minutes: 75
    env:
      # The image defaults to Xcode 27.1; the project needs 27.2.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      # This job needs no mise tools (ShellCheck and actionlint run in repo-lint),
      # so don't let `mise run` install them either.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install: false

      - name: Cache xcprojformatter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/tools
          key: xcprojformatter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/xcprojformatter.sh') }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Lint Swift
        run: mise run lint:swift

      - name: Check project.xcproj is canonical
        run: mise run xcproj:check

      # strings:check rejects hard-coded-strings baseline entries the base doesn't have: the target
      # branch for a pull request, the commit before the push on main (on main itself, origin/main
      # is the pushed commit). The shallow checkout has neither. If the fetch fails (a new branch,
      # a force push), strings:check warns and skips that comparison.
      - name: Fetch the strings baseline's base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          else
            git fetch --no-tags --depth=1 origin "$BEFORE" || echo "::warning::Couldn't fetch $BEFORE"
          fi

      - name: Check Localizable.xcstrings is up to date
        env:
          STRINGS_BASELINE_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: mise run strings:check

      - name: Test repository tools
        run: mise run test:tools

      - name: Test AudiobookshelfKit
        run: mise run test:kit

      - name: Test iOS-only ShakeDetector package suite
        run: mise run test:kit:ios

      # In CI test:kit:ios creates its own abs-ci-<run>-<attempt>-* simulator, because the runner's
      # instances share one CoreSimulator device set, and deletes it. If the job was killed first,
      # delete it here. GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT come from the runner's environment.
      - name: Delete this run's iOS test simulators
        if: always()
        run: scripts/test-kit-ios.sh --delete-run-simulators

      - name: Slow AudiobookshelfKit tests
        if: github.event_name == 'push'
        run: mise run test:kit:slow

      - name: Build for iOS Simulator
        run: mise run build:ios

      - name: Check privacy manifests against built app binaries
        run: mise run privacy:check .build/DerivedData/Build/Products/Debug-iphonesimulator/Audiobookshelf.app

      - name: Test app on macOS
        run: mise run test:app

  ui-tests:
    name: UI tests
    runs-on: xcode-27
    # A job of its own, so its cold app builds run beside build-and-test rather than after it.
    # Recent passing runs take 36–58 minutes (median 47). One stalled test (#627) adds about 13:
    # the UI-test step stops it after 10 (#661), then needs about 3 to restart the runner, list the
    # tests and run it again alone (#666). 75 fitted that in even the slowest run seen (58 + 13);
    # 70 didn't. The iPad steps add about 3 to create and boot a simulator, then the iPad test
    # step, which has its own 35-minute limit: about 5.3 locally, but on CI xcodebuild was still
    # starting the test runner on the cold iPad simulator 12 minutes in, and its first passing run
    # took 21 (#703). 115 fits 58 + 13 + 3 + 35 = 109 plus setup. A second stall in the iPhone run
    # may not fit: the job then times out and fails rather than passing. A passing run doesn't
    # take longer.
    timeout-minutes: 115
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install: false

      - name: Show Xcode version
        run: xcodebuild -version

      # The runner's instances share one CoreSimulator device set, so the job makes its own iPhone
      # Duo (simctl picks the newest runtime for it) and deletes it below. Not abs-ci-<run>-*:
      # build-and-test deletes those, possibly while this job still uses its simulator.
      # Boot it before the tests: the first launch on a cold simulator can outlast XCTest's launch
      # timeout. The UDID is saved first, so the cleanup step deletes it even if the boot fails.
      - name: Create an iPhone Duo simulator
        run: |
          udid="$(xcrun simctl create "abs-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo)"
          echo "IOS_SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b

      # scripts/ui-test-ci.sh runs test:ui. On a shared runner a launch can still time out, so a
      # failed test runs once more in the same test runner. A test still running after 600 s
      # (10 minutes) fails, so a hang ends in time (#661): the slowest passing test seen took 371 s
      # (the slowest usually takes under 250); a hung audit took 1,521 s (#660). XCTest stops it by
      # ending the runner, which that retry can't repeat; -test-repetition-relaunch-enabled could,
      # but it reran the whole suite after one flaky failure (#666). So if one to three tests
      # failed and nothing else did, the script runs only those once more, without building, and
      # that run decides. Anything else fails the step. Local runs of test:ui don't retry.
      - name: UI tests on the iPhone Duo simulator
        env:
          ABS_UI_PLATFORM: ios
        run: scripts/ui-test-ci.sh

      # The result bundles and lists of tests the script left, to see why the step failed.
      - name: Upload the iPhone UI test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-tests-iphone-duo-attempt-${{ github.run_attempt }}
          path: .build/ui-tests/
          retention-days: 7
          if-no-files-found: ignore

      # The iPhone Duo is compact, where open(_:in:)'s sidebar fallback (#693) never runs, so one
      # test that needs it runs on a regular-width iPad too: at AX sizes the iPad's top tab bar hides
      # Account. Only that test: the iPad accessibility audits fail for other reasons (#698). It
      # reuses the iPhone step's build (an iphonesimulator xctestrun serves any simulator) and runs
      # only after that step passes, since the script clears the .build/ui-tests/ it uploads.
      # Nothing uses the iPhone Duo after its step, so it's shut down first rather than left
      # running beside the iPad (#703); the cleanup step below still deletes it.
      - name: Create an iPad simulator
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR_ID" || true
          udid="$(xcrun simctl create "abs-ui-ipad-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB)"
          echo "IPAD_SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b

      # IOS_SIMULATOR_ID is set in the command, not in env:, as the iPhone step's $GITHUB_ENV also sets it.
      # Its own limit makes a stall here fail this step, so its results are uploaded, rather than
      # the job's limit cancelling the run.
      - name: UI tests on the iPad simulator (regular width)
        id: ipad-ui-tests
        timeout-minutes: 35
        env:
          ABS_UI_PLATFORM: ios
          ABS_UI_ACTION: test-without-building
        run: |
          IOS_SIMULATOR_ID="$IPAD_SIMULATOR_ID" scripts/ui-test-ci.sh \
            -only-testing:AudiobookshelfUITests/MiniPlayerTests/testLongPressAtAccessibilitySizeShowsNoMenu

      # Only for the iPad step's own failure: after an iPhone failure the directory has the iPhone results.
      - name: Upload the iPad UI test results
        if: failure() && steps.ipad-ui-tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-tests-ipad-attempt-${{ github.run_attempt }}
          path: .build/ui-tests/
          retention-days: 7
          if-no-files-found: ignore

      # XCUITest on macOS needs Automation Mode, which only an administrator on the runner can
      # enable (docs/testing/ui-tests.md). Until then, warn rather than pass silently. Once it runs,
      # run it with scripts/ui-test-ci.sh, as the iPhone step does, and revisit timeout-minutes
      # (#661, #666).
      - name: UI tests on macOS
        if: ${{ !cancelled() }}
        run: |
          status="$(automationmodetool)"
          echo "$status"
          if grep -q "Automation Mode is disabled" <<< "$status"; then
            echo "::warning title=macOS UI tests skipped::Automation Mode is disabled on this runner, so the macOS UI tests didn't run. An administrator must run 'sudo automationmodetool enable-automationmode-without-authentication' on it."
            exit 0
          fi
          mise run test:ui

      - name: Delete the iPhone Duo simulator
        if: always() && env.IOS_SIMULATOR_ID != ''
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR_ID" || true
          xcrun simctl delete "$IOS_SIMULATOR_ID"

      - name: Delete the iPad simulator
        if: always() && env.IPAD_SIMULATOR_ID != ''
        run: |
          xcrun simctl shutdown "$IPAD_SIMULATOR_ID" || true
          xcrun simctl delete "$IPAD_SIMULATOR_ID"
