[tools]
actionlint = "1.7.12"
shellcheck = "0.11.0"

# Apple tasks use DEVELOPER_DIR from the environment when set (CI selects
# /Applications/Xcode_27.2.app), otherwise /Applications/Xcode.app.

[tasks.lint]
description = "Run all linters (needs Xcode for lint:swift)"
depends = ["lint:repo", "lint:swift"]

[tasks."lint:repo"]
description = "Lint shell scripts and workflows (no Xcode needed)"
depends = ["lint:shell", "lint:actions", "lint:nowplaying", "test:kit:ios:runner"]

[tasks."lint:shell"]
description = "Lint shell scripts with ShellCheck"
run = "shellcheck scripts/*.sh ci_scripts/*.sh"

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks."lint:nowplaying"]
description = "ADR 0006: NowPlaying only, in ABSPlayback/NowPlaying; no MediaPlayer"
run = "scripts/lint-nowplaying.sh"

[tasks."lint:swift"]
description = "Lint Swift sources with swift format"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "swift format lint --strict --recursive --parallel Audiobookshelf AudiobookshelfShared AudiobookshelfTests AudiobookshelfUITests AudiobookshelfWidgets Packages Tools"

[tasks.format]
description = "Format Swift sources in place with swift format"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "swift format format --in-place --recursive --parallel Audiobookshelf AudiobookshelfShared AudiobookshelfTests AudiobookshelfUITests AudiobookshelfWidgets Packages Tools"

[tasks."xcproj:check"]
description = "Verify Audiobookshelf.xcodeproj/project.xcproj is in canonical form"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = """
#!/usr/bin/env bash
set -euo pipefail
canonical="$(mktemp)"
trap 'status=$?; rm -f "$canonical"; exit "$status"' EXIT
if ! scripts/xcprojformatter.sh Audiobookshelf.xcodeproj > "$canonical"; then
  printf "\nerror: xcprojformatter failed; see the output above\n" >&2
  exit 1
fi
if ! diff -u Audiobookshelf.xcodeproj/project.xcproj "$canonical"; then
  echo "error: project.xcproj is not canonical; run 'mise run xcproj:format'" >&2
  exit 1
fi
"""

[tasks."xcproj:format"]
description = "Rewrite Audiobookshelf.xcodeproj/project.xcproj in canonical form"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "scripts/xcprojformatter.sh --update Audiobookshelf.xcodeproj"

[tasks."release:version"]
description = "Set MARKETING_VERSION for every target (mise run release:version 1.2.0), then check project.xcproj"
usage = 'arg "<version>" help="MAJOR.MINOR.PATCH, for example 1.2.0"'
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = """
#!/usr/bin/env bash
set -euo pipefail
scripts/set-version.sh "$usage_version"
mise run xcproj:check
"""

[tasks."build:kit:extension"]
description = "Build AudiobookshelfKit as application-extension-only code for the iOS Simulator (widgets/extensions)"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "swift build --package-path Packages/AudiobookshelfKit --scratch-path .build/swiftpm-appex --triple arm64-apple-ios27.0-simulator --sdk \"$(xcrun --sdk iphonesimulator --show-sdk-path)\" -Xswiftc -application-extension"

[tasks."build:ios"]
description = "Build the app for the iOS Simulator"
depends = ["build:kit:extension"]
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "xcodebuild build -project Audiobookshelf.xcodeproj -scheme Audiobookshelf -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO"

[tasks."build:macos"]
description = "Build the app for macOS"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "xcodebuild build -project Audiobookshelf.xcodeproj -scheme Audiobookshelf -destination 'platform=macOS' -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO"

[tasks."test:kit"]
description = "Run AudiobookshelfKit package tests"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "swift test --package-path Packages/AudiobookshelfKit --scratch-path .build/swiftpm"

[tasks."test:kit:slow"]
description = "Run slow AudiobookshelfKit tests (OSLogStore integration)"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}", ABS_SLOW_TESTS = "1" }
run = "swift test --package-path Packages/AudiobookshelfKit --scratch-path .build/swiftpm --filter OSLogStoreIntegrationTests"

[tasks."test:kit:ios"]
description = "Run and verify the four iOS-only ShakeDetector package tests on an available iPhone"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "scripts/test-kit-ios.sh"

[tasks."test:kit:ios:runner"]
description = "Bounded fake-CLI regressions for the iOS package gate (no Xcode or simulator)"
run = "python3 scripts/test-kit-ios-tests.py"

[tasks."test:server"]
description = "Run the opt-in contract tests against a real Audiobookshelf server (Docker; ABS_SERVER_VERSION picks the release)"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "scripts/test-server.sh test"

[tasks."server:run"]
description = "Start a seeded Audiobookshelf server for manual use and print its URL and login"
run = "scripts/test-server.sh serve"

[tasks."test:app"]
description = "Run app tests on macOS"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
# The sandboxed macOS host app must be signed; sign ad hoc so no team or identity is needed.
# App Group and keychain-group entitlements need a provisioning profile, which an ad hoc
# signature lacks, so the host is signed with sandbox, network-client and user-selected-file
# entitlements only.
# The embedded widget extension likewise gets sandbox only.
# Override ABS_MACOS_ENTITLEMENTS and ABS_WIDGETS_MACOS_ENTITLEMENTS (each read only by its
# target), not CODE_SIGN_ENTITLEMENTS, which would also apply to SwiftPM resource-bundle targets
# and fail to resolve there.
# UI tests run separately, with `test:ui`.
run = "xcodebuild test -project Audiobookshelf.xcodeproj -scheme Audiobookshelf -destination 'platform=macOS' -derivedDataPath .build/DerivedData -skip-testing:AudiobookshelfUITests CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= ABS_MACOS_ENTITLEMENTS=Audiobookshelf/Audiobookshelf-AdHoc.entitlements ABS_WIDGETS_MACOS_ENTITLEMENTS=AudiobookshelfWidgets/AudiobookshelfWidgets-AdHoc.entitlements"

[tasks."test:ios"]
description = "Run app tests on the iPhone Duo simulator"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
# Several simulators can share the name "iPhone Duo", which xcodebuild rejects as
# ambiguous, so resolve one by name (newest runtime is listed last). Override with
# IOS_SIMULATOR_ID=<udid>.
run = """
#!/usr/bin/env bash
set -euo pipefail
udid="${IOS_SIMULATOR_ID:-$(xcrun simctl list devices available | grep -E '^ +iPhone Duo [(]' | tail -n 1 | grep -oE '[0-9A-F-]{36}' || true)}"
if [[ -z "$udid" ]]; then
  echo "error: no available iPhone Duo simulator; create one in Xcode or set IOS_SIMULATOR_ID" >&2
  exit 1
fi
xcodebuild test -project Audiobookshelf.xcodeproj -scheme Audiobookshelf -destination "platform=iOS Simulator,id=$udid" -derivedDataPath .build/DerivedData -skip-testing:AudiobookshelfUITests CODE_SIGNING_ALLOWED=NO
"""

[tasks."test:ui"]
description = "Run the UI tests against the fixture server on macOS (ABS_UI_PLATFORM=ios for the iPhone Duo simulator)"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
# The app launches with -ABSFixtures, so no server is needed (docs/testing/ui-tests.md). macOS
# signs ad hoc as test:app does; iOS resolves a simulator as test:ios does.
run = """
#!/usr/bin/env bash
set -euo pipefail
common=(-project Audiobookshelf.xcodeproj -scheme Audiobookshelf -derivedDataPath .build/DerivedData -only-testing:AudiobookshelfUITests)
case "${ABS_UI_PLATFORM:-macos}" in
  macos)
    xcodebuild test "${common[@]}" -destination 'platform=macOS' CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= ABS_MACOS_ENTITLEMENTS=Audiobookshelf/Audiobookshelf-AdHoc.entitlements ABS_WIDGETS_MACOS_ENTITLEMENTS=AudiobookshelfWidgets/AudiobookshelfWidgets-AdHoc.entitlements "$@"
    ;;
  ios)
    udid="${IOS_SIMULATOR_ID:-$(xcrun simctl list devices available | grep -E '^ +iPhone Duo [(]' | tail -n 1 | grep -oE '[0-9A-F-]{36}' || true)}"
    if [[ -z "$udid" ]]; then
      echo "error: no available iPhone Duo simulator; create one in Xcode or set IOS_SIMULATOR_ID" >&2
      exit 1
    fi
    xcodebuild test "${common[@]}" -destination "platform=iOS Simulator,id=$udid" CODE_SIGNING_ALLOWED=NO "$@"
    ;;
  *)
    echo "error: ABS_UI_PLATFORM must be macos or ios" >&2
    exit 1
    ;;
esac
"""

[tasks."test:tools"]
description = "Run repository tool tests (Tools/StringsImport, and the release scripts in test:release)"
depends = ["test:release"]
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "swift test --package-path Tools/StringsImport --scratch-path .build/strings-import"

[tasks."test:release"]
description = "Test scripts/set-version.sh and the What to Test notes in ci_scripts/ci_post_xcodebuild.sh"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "python3 scripts/test-release-tests.py"

[tasks.test]
description = "Run package, tool, and app tests"
depends = ["test:kit", "test:tools", "test:app"]

[tasks.strings]
description = "Generate ABSUI's Localizable.xcstrings from strings/ and Localization/native/"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "swift run --package-path Tools/StringsImport --scratch-path .build/strings-import import-strings"

[tasks."strings:check"]
description = "Verify Localizable.xcstrings and CFBundleLocalizations are up to date"
env = { DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode.app/Contents/Developer') }}" }
run = "swift run --package-path Tools/StringsImport --scratch-path .build/strings-import import-strings --check"

[tasks."upstream:check"]
description = "Preview the upstream-sync issue without creating it"
run = "DRY_RUN=true scripts/upstream-sync.sh"
