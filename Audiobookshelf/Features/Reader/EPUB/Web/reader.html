<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      Strict CSP. Book sections render in srcdoc iframes, which inherit this policy, so their
      styles, images and fonts (inline or blob: URLs made by epub.js from the archive) are allowed,
      while scripts run only from this page's own files. The book's own scripts are blocked
      twice: here, and by the iframe sandbox (allowScriptedContent: false).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src blob: data:; font-src blob: data:; media-src blob:; connect-src absreader://book; frame-src 'self' blob:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #viewer {
        width: 100%;
        height: 100%;
      }
    </style>
    <script src="jszip.min.js"></script>
    <script src="epub.min.js"></script>
    <script src="reader.js"></script>
  </head>
  <body>
    <div id="viewer"></div>
  </body>
</html>
